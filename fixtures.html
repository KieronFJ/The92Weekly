<header>
  <div class="logo">
    THE<span class="green">92</span>WEEKLY
  </div>

  <nav>
    <a href="membership.html">Membership</a>

</header>

<main>

  <div class="breadcrumb">
    Home &nbsp;/&nbsp; Fixtures
  </div>

  <a class="back" href="teams.html">← Back to teams</a>

  <h1 id="pageTitle">Fixtures</h1>

  <div class="intro" id="pageIntro">
    All scheduled matches
  </div>

  <div class="controls">
    <label for="teamSelect">Select a team</label>

    <select id="teamSelect">
      <option value="">Loading teams…</option>
    </select>
  </div>

  <div id="fixtures">
    <div class="loading">
      Loading fixtures…
    </div>
  </div>

  <div class="source">
    Fixture data supplied from The92Weekly football data feed.
  </div>

</main>

<script>

const DATA_URL = "data/football-data.json";

let allMatches = [];
let allTeams = [];


/* -------------------------------------------------
   Helpers
------------------------------------------------- */

function getTeamFromURL() {
  const params = new URLSearchParams(window.location.search);

  return {
    name: params.get("team"),
    id: params.get("teamId")
  };
}


function formatDate(dateString) {
  const date = new Date(dateString);

  return date.toLocaleDateString("en-GB", {
    weekday: "short",
    day: "2-digit",
    month: "short"
  });
}


function formatTime(dateString) {
  const date = new Date(dateString);

  return date.toLocaleTimeString("en-GB", {
    hour: "2-digit",
    minute: "2-digit"
  });
}


function monthName(dateString) {
  const date = new Date(dateString);

  return date.toLocaleDateString("en-GB", {
    month: "long",
    year: "numeric"
  });
}


function isTeamInMatch(match, teamName, teamId) {

  if (!match.home || !match.away) {
    return false;
  }

  if (teamId) {
    return (
      String(match.home.id) === String(teamId) ||
      String(match.away.id) === String(teamId)
    );
  }

  if (teamName) {
    const wanted = teamName.toLowerCase();

    return (
      String(match.home.name).toLowerCase() === wanted ||
      String(match.away.name).toLowerCase() === wanted
    );
  }

  return true;
}


function getScore(match) {

  /*
    ESPN gives scores for completed/live games.
    Future games may not have scores.
  */

  const homeScore = match.home && match.home.score;
  const awayScore = match.away && match.away.score;

  const hasHomeScore =
    homeScore !== undefined &&
    homeScore !== null &&
    homeScore !== "";

  const hasAwayScore =
    awayScore !== undefined &&
    awayScore !== null &&
    awayScore !== "";

  if (hasHomeScore && hasAwayScore) {
    return `${homeScore}–${awayScore}`;
  }

  return "";
}


function getStatus(match) {

  if (match.completed === true) {
    return "FT";
  }

  if (match.statusDetail) {

    /*
      Examples from ESPN:
      39
      HT
      FT
      STATUS_FIRST_HALF
    */

    if (match.statusDetail === "HT") {
      return "HT";
    }
  }

  if (match.status === "STATUS_FIRST_HALF") {
    return "LIVE";
  }

  if (match.status === "STATUS_SECOND_HALF") {
    return "LIVE";
  }

  if (match.status === "STATUS_HALFTIME") {
    return "HT";
  }

  return "";
}


function sortMatches(matches) {

  return matches.sort((a, b) => {
    return new Date(a.date) - new Date(b.date);
  });
}


/* -------------------------------------------------
   Build team list
------------------------------------------------- */

function buildTeams() {

  const map = new Map();

  allMatches.forEach(match => {

    if (match.home && match.home.name) {

      const key = String(match.home.id || match.home.name);

      if (!map.has(key)) {
        map.set(key, {
          id: match.home.id,
          name: match.home.name
        });
      }
    }

    if (match.away && match.away.name) {

      const key = String(match.away.id || match.away.name);

      if (!map.has(key)) {
        map.set(key, {
          id: match.away.id,
          name: match.away.name
        });
      }
    }

  });

  allTeams = Array.from(map.values()).sort((a, b) =>
    a.name.localeCompare(b.name)
  );


  const select = document.getElementById("teamSelect");

  select.innerHTML = "";

  const allOption = document.createElement("option");

  allOption.value = "";
  allOption.textContent = "All teams";

  select.appendChild(allOption);


  allTeams.forEach(team => {

    const option = document.createElement("option");

    option.value = team.id || team.name;
    option.textContent = team.name;

    select.appendChild(option);

  });
}


/* -------------------------------------------------
   Render fixtures
------------------------------------------------- */

function renderFixtures(teamName = "", teamId = "") {

  const container = document.getElementById("fixtures");

  let matches = allMatches.filter(match =>
    isTeamInMatch(match, teamName, teamId)
  );

  matches = sortMatches(matches);


  if (!matches.length) {

    container.innerHTML = `
      <div class="empty">
        No fixtures found for this team.
      </div>
    `;

    return;
  }


  /*
    Group EVERY match by month.
    Nothing is limited to August or to the first
    few results.
  */

  const groups = {};

  matches.forEach(match => {

    const month = monthName(match.date);

    if (!groups[month]) {
      groups[month] = [];
    }

    groups[month].push(match);

  });


  let html = "";


  Object.keys(groups).forEach(month => {

    html += `
      <section class="month">
        <h2 class="month-title">${month}</h2>
    `;


    groups[month].forEach(match => {

      const home = match.home?.name || "TBC";
      const away = match.away?.name || "TBC";

      const competition =
        match.competition || "Football";

      const date = formatDate(match.date);
      const time = formatTime(match.date);

      const venue =
        match.venue ? match.venue : "";

      const score = getScore(match);
      const status = getStatus(match);

      const completed = match.completed === true;

      let scoreHTML = "";

      if (score) {

        scoreHTML = `
          <div class="score">
            ${score}
          </div>
        `;

      } else {

        scoreHTML = `
          <div class="score upcoming">
            ${time}
          </div>
        `;

      }


      html += `
        <article class="fixture">

          <div class="fixture-main">

            <div class="teams">
              ${home} vs ${away}
            </div>

            <div class="details">

              ${competition}
              &nbsp;·&nbsp;
              ${date}
              ${completed && status ? ` · ${status}` : ""}
              ${!completed ? ` · ${time}` : ""}

              ${venue
                ? `<span class="venue">· ${venue}</span>`
                : ""
              }

            </div>

          </div>

          ${scoreHTML}

        </article>
      `;

    });


    html += `
      </section>
    `;

  });


  container.innerHTML = html;
}


/* -------------------------------------------------
   Update URL
------------------------------------------------- */

function updateURL(team) {

  const url = new URL(window.location.href);

  if (!team) {

    url.searchParams.delete("team");
    url.searchParams.delete("teamId");

  } else {

    url.searchParams.delete("team");

    if (team.id) {

      url.searchParams.set("teamId", team.id);

    } else {

      url.searchParams.set("team", team.name);

    }

  }

  window.history.replaceState({}, "", url);

}


/* -------------------------------------------------
   Team selector
------------------------------------------------- */

document
  .getElementById("teamSelect")
  .addEventListener("change", function() {

    const value = this.value;

    if (!value) {

      document.getElementById("pageTitle").textContent =
        "Fixtures";

      document.getElementById("pageIntro").textContent =
        "All scheduled matches";

      renderFixtures();

      updateURL(null);

      return;
    }


    const team = allTeams.find(t =>
      String(t.id || t.name) === String(value)
    );


    if (!team) {
      return;
    }


    document.getElementById("pageTitle").textContent =
      team.name;

    document.getElementById("pageIntro").textContent =
      "2026/27 · all scheduled matches";


    renderFixtures(
      team.name,
      team.id
    );


    updateURL(team);

  });


/* -------------------------------------------------
   Load JSON
------------------------------------------------- */

async function loadData() {

  const container = document.getElementById("fixtures");

  try {

    const response = await fetch(
      DATA_URL + "?v=" + Date.now()
    );

    if (!response.ok) {
      throw new Error(
        "Could not load football-data.json"
      );
    }


    const data = await response.json();


    if (!data.matches || !Array.isArray(data.matches)) {
      throw new Error(
        "football-data.json does not contain a matches array."
      );
    }


    allMatches = data.matches;


    /*
      IMPORTANT:
      We do NOT slice the data.
      We do NOT limit it to one month.
      We do NOT take only the first few fixtures.

      Every match in football-data.json is available.
    */


    buildTeams();


    const selected = getTeamFromURL();


    if (selected.name || selected.id) {

      let team = null;


      if (selected.id) {

        team = allTeams.find(t =>
          String(t.id) === String(selected.id)
        );

      }


      if (!team && selected.name) {

        team = allTeams.find(t =>
          t.name.toLowerCase() ===
          selected.name.toLowerCase()
        );

      }


      if (team) {

        document.getElementById("teamSelect").value =
          team.id || team.name;

        document.getElementById("pageTitle").textContent =
          team.name;

        document.getElementById("pageIntro").textContent =
          "2026/27 · all scheduled matches";


        renderFixtures(
          team.name,
          team.id
        );

        return;
      }

    }


    /*
      If no team is specified in the URL,
      show every fixture.
    */

    renderFixtures();

  } catch (error) {

    console.error(error);

    container.innerHTML = `
      <div class="error">
        <strong>We could not load the fixture list.</strong>
        <br><br>
        ${error.message}
      </div>
    `;

  }

}


loadData();

</script>

</body>
</html>
