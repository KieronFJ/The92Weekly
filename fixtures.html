<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixtures — The92Weekly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--panel:#f6f5f1;--line:#e3e0d8;--line-soft:#edeae3;--ink:#2e3136;--muted:#74787e;--gold:#149954}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Source Serif 4',serif;line-height:1.6}
a{color:inherit;text-decoration:none}
.display{font-family:Poppins,sans-serif}
header{border-bottom:1px solid var(--line);padding:28px 6vw 24px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
.nameplate{font:700 clamp(30px,4.4vw,40px)/1 Poppins,sans-serif;text-transform:uppercase}
.nameplate span{color:var(--gold)}
nav{display:flex;gap:18px;padding-bottom:4px}
nav a{font:500 14.5px Poppins,sans-serif;color:var(--muted);border-bottom:2px solid transparent;padding-bottom:4px}
nav a:hover{color:var(--ink);border-bottom-color:var(--gold)}
main{max-width:760px;margin:0 auto;padding:32px 6vw 80px}
.breadcrumb{font:12px 'JetBrains Mono',monospace;color:var(--muted);margin-bottom:28px}
.breadcrumb a:hover{color:var(--gold)}
.tag{font:10.5px 'JetBrains Mono',monospace;color:#fff;background:var(--gold);padding:4px 9px;border-radius:2px;letter-spacing:.06em;display:inline-block;margin-bottom:16px}
h1{font:600 clamp(30px,5vw,48px)/1.1 Poppins,sans-serif;margin-bottom:8px}
.subtitle{font:14px 'JetBrains Mono',monospace;color:var(--muted);margin-bottom:30px}
.back{display:inline-block;margin-bottom:26px;font:600 13px Poppins,sans-serif;color:var(--gold)}
.month{margin-top:32px}
.month h2{font:600 16px Poppins,sans-serif;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:2px}
.match{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--line-soft)}
.match-main{min-width:0}
.teams{font:500 14.5px Poppins,sans-serif}
.meta{font:11.5px 'JetBrains Mono',monospace;color:var(--muted);margin-top:3px}
.score{font:700 15px 'JetBrains Mono',monospace;white-space:nowrap}
.status{padding:40px 0;text-align:center;font:14px 'JetBrains Mono',monospace;color:var(--muted)}
.note{margin-top:30px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);font:12px 'JetBrains Mono',monospace;color:var(--muted)}
@media(max-width:650px){nav{gap:10px;flex-wrap:wrap}.match{align-items:flex-start}.teams{font-size:13.5px}}
</style>
</head>
<body>
<header>
  <div><a href="index.html"><div class="nameplate">THE<span>92</span>WEEKLY</div></a></div>
  <nav>
    <a href="membership.html">Membership</a>
    <a href="index.html#latest">Latest</a>
    <a href="teams.html">Teams</a>
    <a href="tables.html">Tables</a>
    <a href="about.html">About</a>
  </nav>
</header>

<main>
  <div class="breadcrumb"><a href="index.html">Home</a> / <a href="teams.html">All 92</a> / <span id="crumb">Fixtures</span></div>
  <a id="back-link" class="back" href="#">← Back to team</a>
  <span id="division-tag" class="tag">DIVISION</span>
  <h1 id="team-name">Loading…</h1>
  <div id="subtitle" class="subtitle">Full-season fixtures</div>
  <div id="fixtures"><div class="status">Loading the full season…</div></div>
</main>

<script>
const params = new URLSearchParams(location.search);
const teamName = params.get('team') || '';
const div = params.get('div') || '1';

const divisionNames = {1:'Premier League',2:'Championship',3:'League One',4:'League Two'};
const espnLeagues = {1:'eng.1',2:'eng.2',3:'eng.3',4:'eng.4'};

document.getElementById('team-name').textContent = teamName || 'Team';
document.getElementById('crumb').textContent = teamName || 'Fixtures';
document.getElementById('division-tag').textContent = divisionNames[div] || 'Division';
document.getElementById('subtitle').textContent = `2026/27 · ${divisionNames[div] || 'English football'} · all scheduled matches`;

const back = document.getElementById('back-link');
back.href = `team.html?team=${encodeURIComponent(teamName)}&div=${encodeURIComponent(div)}`;

function normalize(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function matchesTeam(a,b){const x=normalize(a),y=normalize(b);return x.includes(y)||y.includes(x)}
function proxy(url){
  const worker = `https://the92weekly-proxyv2.the92weekly.workers.dev/?url=${encodeURIComponent(url)}`;
  return fetch(worker).then(r=>{if(!r.ok)throw new Error('Proxy error');return r.json()});
}

async function getTeamId(){
  const league=espnLeagues[div];
  const data=await proxy(`https://site.api.espn.com/apis/site/v2/sports/soccer/${league}/teams?limit=50`);
  const teams=data.sports?.[0]?.leagues?.[0]?.teams||[];
  const found=teams.map(x=>x.team).find(t=>matchesTeam(t.displayName,t.name||'') && matchesTeam(t.displayName,teamName));
  if(!found) throw new Error('Team not found');
  return found.id;
}

function normaliseEvent(ev){
  const c=ev.competitions?.[0];
  const teams=c?.competitors||[];
  const home=teams.find(x=>x.homeAway==='home');
  const away=teams.find(x=>x.homeAway==='away');
  if(!home||!away)return null;
  const status=ev.status?.type||c?.status?.type||{};
  return {
    id:String(ev.id),
    date:ev.date,
    competition:c?.type?.text || ev.season?.displayName || '',
    competitionName:c?.type?.text || '',
    completed:Boolean(status.completed),
    statusDetail:status.detail||'',
    home:home.team?.displayName||home.team?.name||'',
    away:away.team?.displayName||away.team?.name||'',
    homeScore:home.score!=null?Number(home.score):null,
    awayScore:away.score!=null?Number(away.score):null
  };
}

function competitionName(ev){
  const c=ev.competitions?.[0];
  const text=c?.type?.text||'';
  if(text && !/^regular season$/i.test(text)) return text;
  const season=ev.season?.displayName||'';
  return season || divisionNames[div] || 'Football';
}

async function loadSeason(){
  const id=await getTeamId();
  const league=espnLeagues[div];
  const data=await proxy(`https://site.api.espn.com/apis/site/v2/sports/soccer/${league}/teams/${id}/schedule`);
  let events=(data.events||[]).map(ev=>{
    const m=normaliseEvent(ev);
    if(!m)return null;
    m.competition=competitionName(ev);
    return m;
  }).filter(Boolean);

  // Keep the current 2026/27 season only and remove duplicates.
  const seen=new Set();
  events=events.filter(m=>{
    const key=m.id||`${m.date}|${m.home}|${m.away}`;
    if(seen.has(key))return false;
    seen.add(key);
    return true;
  });

  events.sort((a,b)=>new Date(a.date)-new Date(b.date));
  return events;
}

function monthLabel(date){
  return new Date(date).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
}

function render(events){
  const root=document.getElementById('fixtures');
  if(!events.length){
    root.innerHTML='<div class="status">No season fixtures were returned by the football data source.</div>';
    return;
  }

  const groups={};
  events.forEach(m=>(groups[monthLabel(m.date)]??=[]).push(m));

  let html='';
  for(const [month,matches] of Object.entries(groups)){
    html+=`<section class="month"><h2>${month}</h2>`;
    matches.forEach(m=>{
      const d=new Date(m.date);
      const date=d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
      const time=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
      const score=(m.homeScore!==null&&m.awayScore!==null)?`${m.homeScore}–${m.awayScore}`:'';
      html+=`<div class="match">
        <div class="match-main">
          <div class="teams">${m.home} vs ${m.away}</div>
          <div class="meta">${m.competition} · ${date} · ${time}</div>
        </div>
        <div class="score">${score}</div>
      </div>`;
    });
    html+='</section>';
  }
  root.innerHTML=html;
}

loadSeason().then(render).catch(err=>{
  console.error(err);
  document.getElementById('fixtures').innerHTML=
    '<div class="status">We could not load the full fixture list right now. Please refresh in a moment.</div>';
});
</script>
</body>
</html>
