<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixtures — The92Weekly</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#fff;
  --panel:#f6f5f1;
  --line:#e3e0d8;
  --line-soft:#edeae3;
  --ink:#2e3136;
  --muted:#74787e;
  --green:#149954;
  --win:#3e8a4d;
  --loss:#b5504b;
  --draw:#74787e;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Source Serif 4',serif;
  line-height:1.6;
}

a{
  color:inherit;
  text-decoration:none;
}

.display{
  font-family:Poppins,sans-serif;
}

header{
  border-bottom:1px solid var(--line);
  padding:28px 6vw 24px;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  flex-wrap:wrap;
  gap:12px;
}

.nameplate{
  font:700 clamp(30px,4.4vw,40px)/1 Poppins,sans-serif;
  text-transform:uppercase;
}

.nameplate span{
  color:var(--green);
}

nav{
  display:flex;
  gap:18px;
  padding-bottom:4px;
}

nav a{
  font:500 14.5px Poppins,sans-serif;
  color:var(--muted);
  border-bottom:2px solid transparent;
  padding-bottom:4px;
}

nav a:hover{
  color:var(--ink);
  border-bottom-color:var(--green);
}

main{
  max-width:760px;
  margin:0 auto;
  padding:32px 6vw 80px;
}

.breadcrumb{
  font:12px 'JetBrains Mono',monospace;
  color:var(--muted);
  margin-bottom:28px;
}

.breadcrumb a:hover{
  color:var(--green);
}

.tag{
  font:10.5px 'JetBrains Mono',monospace;
  color:#fff;
  background:var(--green);
  padding:4px 9px;
  border-radius:2px;
  letter-spacing:.06em;
  display:inline-block;
  margin-bottom:16px;
}

h1{
  font:600 clamp(30px,5vw,48px)/1.1 Poppins,sans-serif;
  margin-bottom:8px;
}

.subtitle{
  font:14px 'JetBrains Mono',monospace;
  color:var(--muted);
  margin-bottom:30px;
}

.back{
  display:inline-block;
  margin-bottom:26px;
  font:600 13px Poppins,sans-serif;
  color:var(--green);
}

.month{
  margin-top:32px;
}

.month h2{
  font:600 16px Poppins,sans-serif;
  padding-bottom:10px;
  border-bottom:1px solid var(--line);
  margin-bottom:2px;
}

.match{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:15px 0;
  border-bottom:1px solid var(--line-soft);
}

.match-main{
  min-width:0;
}

.teams{
  font:500 14.5px Poppins,sans-serif;
}

.meta{
  font:11.5px 'JetBrains Mono',monospace;
  color:var(--muted);
  margin-top:3px;
}

.score{
  font:700 15px 'JetBrains Mono',monospace;
  white-space:nowrap;
}

.status{
  padding:40px 0;
  text-align:center;
  font:14px 'JetBrains Mono',monospace;
  color:var(--muted);
}

.note{
  margin-top:30px;
  padding:16px 18px;
  background:var(--panel);
  border:1px solid var(--line);
  font:12px 'JetBrains Mono',monospace;
  color:var(--muted);
}

.result-win{
  color:var(--win);
}

.result-loss{
  color:var(--loss);
}

.result-draw{
  color:var(--draw);
}

@media(max-width:650px){

  nav{
    gap:10px;
    flex-wrap:wrap;
  }

  .match{
    align-items:flex-start;
  }

  .teams{
    font-size:13.5px;
  }

}
</style>
</head>

<body>

<header>

  <div>
    <a href="index.html">
      <div class="nameplate">THE<span>92</span>WEEKLY</div>
    </a>
  </div>

  <nav>
    <a href="membership.html">Membership</a>
    <a href="index.html#latest">Latest</a>
    <a href="teams.html">Teams</a>
    <a href="tables.html">Tables</a>
    <a href="about.html">About</a>
  </nav>

</header>

<main>

  <div class="breadcrumb">
    <a href="index.html">Home</a>
    /
    <a href="teams.html">All 92</a>
    /
    <span id="crumb">Fixtures</span>
  </div>

  <a id="back-link" class="back" href="#">
    ← Back to team
  </a>

  <span id="division-tag" class="tag">
    DIVISION
  </span>

  <h1 id="team-name">
    Loading…
  </h1>

  <div id="subtitle" class="subtitle">
    2026/27 · all scheduled matches
  </div>

  <div id="fixtures">
    <div class="status">
      Loading the full fixture list…
    </div>
  </div>

</main>

<script>

/* ---------------------------------------
   READ TEAM AND DIVISION FROM URL
--------------------------------------- */

const params = new URLSearchParams(location.search);

const teamName = params.get('team') || '';

const div = params.get('div') || '1';


/* ---------------------------------------
   DIVISION NAMES
--------------------------------------- */

const divisionNames = {
  1:'Premier League',
  2:'Championship',
  3:'League One',
  4:'League Two'
};


/* ---------------------------------------
   DATA FILE
--------------------------------------- */

const DATA_URL = 'data/football-data.json';


/* ---------------------------------------
   PAGE HEADER
--------------------------------------- */

document.getElementById('team-name').textContent =
  teamName || 'Team';

document.getElementById('crumb').textContent =
  teamName || 'Fixtures';

document.getElementById('division-tag').textContent =
  divisionNames[div] || 'Division';

document.getElementById('subtitle').textContent =
  `2026/27 · ${divisionNames[div] || 'English football'} · all scheduled matches`;


/* ---------------------------------------
   BACK TO TEAM LINK
--------------------------------------- */

const back = document.getElementById('back-link');

back.href =
  `team.html?team=${encodeURIComponent(teamName)}&div=${encodeURIComponent(div)}`;


/* ---------------------------------------
   TEAM NAME NORMALISATION
--------------------------------------- */

function normalize(name){

  return String(name || '')
    .toLowerCase()
    .replace(/&/g,'and')
    .replace(/football club/g,'')
    .replace(/fc$/g,'')
    .replace(/[^a-z0-9]/g,'');

}


/* ---------------------------------------
   CHECK WHETHER TWO TEAM NAMES MATCH
--------------------------------------- */

function matchesTeam(nameA,nameB){

  const a = normalize(nameA);
  const b = normalize(nameB);

  if(!a || !b) return false;

  return a === b || a.includes(b) || b.includes(a);

}


/* ---------------------------------------
   LOAD OUR OWN JSON FILE
--------------------------------------- */

async function loadData(){

  const response = await fetch(DATA_URL, {
    cache:'no-store'
  });

  if(!response.ok){

    throw new Error(
      `Could not load football-data.json (${response.status})`
    );

  }

  return await response.json();

}


/* ---------------------------------------
   GET TEAM'S MATCHES
--------------------------------------- */

function getTeamMatches(data){

  const allMatches = Array.isArray(data.matches)
    ? data.matches
    : [];

  const competitionCode = {
    1:'eng.1',
    2:'eng.2',
    3:'eng.3',
    4:'eng.4'
  }[div];


  /* Filter by division */

  let matches = allMatches.filter(match => {

    if(!competitionCode){
      return true;
    }

    return match.competitionCode === competitionCode;

  });


  /* Filter by team */

  matches = matches.filter(match => {

    const homeName = match.home?.name || '';
    const awayName = match.away?.name || '';

    return matchesTeam(homeName,teamName) ||
           matchesTeam(awayName,teamName);

  });


  /* Remove duplicates */

  const seen = new Set();

  matches = matches.filter(match => {

    const key =
      match.id ||
      `${match.date}|${match.home?.name}|${match.away?.name}`;

    if(seen.has(key)){
      return false;
    }

    seen.add(key);

    return true;

  });


  /* Sort chronologically */

  matches.sort((a,b) => {

    return new Date(a.date) - new Date(b.date);

  });


  return matches;

}


/* ---------------------------------------
   FORMAT MONTH
--------------------------------------- */

function monthLabel(date){

  return new Date(date).toLocaleDateString(
    'en-GB',
    {
      month:'long',
      year:'numeric'
    }
  );

}


/* ---------------------------------------
   FORMAT MATCH RESULT
--------------------------------------- */

function getResult(match){

  if(
    match.home?.score == null ||
    match.away?.score == null
  ){

    return {
      text:'',
      className:''
    };

  }


  const homeScore = Number(match.home.score);
  const awayScore = Number(match.away.score);


  const homeTeam =
    matchesTeam(match.home?.name,teamName);


  let result;


  if(homeScore === awayScore){

    result = 'draw';

  }else{

    const teamWon =
      homeTeam
        ? homeScore > awayScore
        : awayScore > homeScore;

    result = teamWon ? 'win' : 'loss';

  }


  return {
    text:`${homeScore}–${awayScore}`,
    className:`result-${result}`
  };

}


/* ---------------------------------------
   FORMAT COMPETITION
--------------------------------------- */

function competitionName(match){

  return match.competition ||
         divisionNames[div] ||
         'Football';

}


/* ---------------------------------------
   RENDER FIXTURES
--------------------------------------- */

function render(matches){

  const root =
    document.getElementById('fixtures');


  if(!matches.length){

    root.innerHTML = `
      <div class="status">
        No 2026/27 fixtures were found for this team.
      </div>
    `;

    return;

  }


  const groups = {};


  matches.forEach(match => {

    const month = monthLabel(match.date);

    if(!groups[month]){
      groups[month] = [];
    }

    groups[month].push(match);

  });


  let html = '';


  for(const [month,monthMatches] of Object.entries(groups)){

    html += `
      <section class="month">
        <h2>${month}</h2>
    `;


    monthMatches.forEach(match => {

      const date =
        new Date(match.date);


      const dateText =
        date.toLocaleDateString(
          'en-GB',
          {
            weekday:'short',
            day:'numeric',
            month:'short'
          }
        );


      const timeText =
        date.toLocaleTimeString(
          'en-GB',
          {
            hour:'2-digit',
            minute:'2-digit'
          }
        );


      const result =
        getResult(match);


      const status =
        match.completed
          ? 'FT'
          : timeText;


      const venue =
        match.venue
          ? ` · ${match.venue}`
          : '';


      html += `

        <div class="match">

          <div class="match-main">

            <div class="teams">
              ${match.home?.name || 'Home'}
              vs
              ${match.away?.name || 'Away'}
            </div>

            <div class="meta">
              ${competitionName(match)}
              ·
              ${dateText}
              ·
              ${status}
              ${venue}
            </div>

          </div>

          <div class="score ${result.className}">
            ${result.text}
          </div>

        </div>

      `;

    });


    html += `
      </section>
    `;

  }


  root.innerHTML = html;


  /* Small note showing where the data came from */

  const note = document.createElement('div');

  note.className = 'note';

  note.textContent =
    'Fixture data supplied from The92Weekly football data feed.';

  root.appendChild(note);

}


/* ---------------------------------------
   LOAD EVERYTHING
--------------------------------------- */

async function start(){

  try{

    if(!teamName){

      throw new Error('No team was supplied in the URL.');

    }


    const data =
      await loadData();


    const matches =
      getTeamMatches(data);


    render(matches);


  }catch(error){

    console.error(error);


    document.getElementById('fixtures').innerHTML = `

      <div class="status">

        We could not load the full 2026/27
        fixture list right now.

        <br><br>

        Please refresh the page in a moment.

      </div>

    `;

  }

}


start();

</script>

</body>
</html>
