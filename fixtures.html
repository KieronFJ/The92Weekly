<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixtures — The92Weekly</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#fff;
  --panel:#f6f5f1;
  --line:#e3e0d8;
  --line-soft:#edeae3;
  --ink:#2e3136;
  --muted:#74787e;
  --gold:#149954;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Source Serif 4',serif;
  line-height:1.6;
}

a{
  color:inherit;
  text-decoration:none;
}

.display{
  font-family:Poppins,sans-serif;
}

  border-bottom:1px solid var(--line);
  padding:28px 6vw 24px;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  flex-wrap:wrap;
  gap:12px;
}

.nameplate{
  font:700 clamp(30px,4.4vw,40px)/1 Poppins,sans-serif;
  text-transform:uppercase;
}

.nameplate span{
  color:var(--gold);
}

  display:flex;

}

  color:var(--ink);

}

main{
  max-width:760px;
  margin:0 auto;
  padding:32px 6vw 80px;
}

.breadcrumb{
  font:12px 'JetBrains Mono',monospace;
  color:var(--muted);
  margin-bottom:28px;
}

.breadcrumb a:hover{
  color:var(--gold);
}

.tag{
  font:10.5px 'JetBrains Mono',monospace;
  color:#fff;
  background:var(--gold);
  padding:4px 9px;
  border-radius:2px;
  letter-spacing:.06em;
  display:inline-block;
  margin-bottom:16px;
}

h1{
  font:600 clamp(30px,5vw,48px)/1.1 Poppins,sans-serif;
  margin-bottom:8px;
}

.subtitle{
  font:14px 'JetBrains Mono',monospace;
  color:var(--muted);
  margin-bottom:30px;
}

.back{
  display:inline-block;
  margin-bottom:26px;
  font:600 13px Poppins,sans-serif;
  color:var(--gold);
}

.month{
  margin-top:32px;
}

.month h2{
  font:600 16px Poppins,sans-serif;
  padding-bottom:10px;
  border-bottom:1px solid var(--line);
  margin-bottom:2px;
}

.match{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:15px 0;
  border-bottom:1px solid var(--line-soft);
}

.match-main{
  min-width:0;
  flex:1;
}

.teams{
  font:500 14.5px Poppins,sans-serif;
}

.meta{
  font:11.5px 'JetBrains Mono',monospace;
  color:var(--muted);
  margin-top:3px;
}

.score{
  font:700 15px 'JetBrains Mono',monospace;
  white-space:nowrap;
  text-align:right;
}

.status{
  padding:40px 0;
  text-align:center;
  font:14px 'JetBrains Mono',monospace;
  color:var(--muted);
}

.note{
  margin-top:30px;
  padding:16px 18px;
  background:var(--panel);
  border:1px solid var(--line);
  font:12px 'JetBrains Mono',monospace;
  color:var(--muted);
}

.error{
  color:#a33;
}

@media(max-width:650px){

  nav{
    gap:10px;
    flex-wrap:wrap;
  }

  .match{
    align-items:flex-start;
  }

  .teams{
    font-size:13.5px;
  }

  .meta{
    line-height:1.5;
  }

  .score{
    font-size:14px;
  }
}
</style>
</head>

<body>

<header>
  <div>
    <a href="index.html">
      <div class="nameplate">THE<span>92</span>WEEKLY</div>
    </a>
  </div>

  <nav>
    <a href="membership.html">Membership</a>
    <a href="index.html#latest">Latest</a>
    <a href="teams.html">Teams</a>
    <a href="tables.html">Tables</a>
    <a href="about.html">About</a>
  </nav>
</header>

<main>

  <div class="breadcrumb">
    <a href="index.html">Home</a>
    /
    <a href="teams.html">All 92</a>
    /
    <span id="crumb">Fixtures</span>
  </div>

  <a id="back-link" class="back" href="#">
    ← Back to team
  </a>

  <span id="division-tag" class="tag">
    DIVISION
  </span>

  <h1 id="team-name">
    Loading…
  </h1>

  <div id="subtitle" class="subtitle">
    Full-season fixtures
  </div>

  <div id="fixtures">
    <div class="status">
      Loading fixtures…
    </div>
  </div>

</main>

<script>

const params = new URLSearchParams(location.search);

const teamName = params.get('team') || '';
const div = params.get('div') || '1';

const divisionNames = {
  '1':'Premier League',
  '2':'Championship',
  '3':'League One',
  '4':'League Two'
};

const competitionCodes = {
  '1':'eng.1',
  '2':'eng.2',
  '3':'eng.3',
  '4':'eng.4'
};

const divisionName =
  divisionNames[div] || 'English football';

const competitionCode =
  competitionCodes[div] || '';

document.getElementById('team-name').textContent =
  teamName || 'Team';

document.getElementById('crumb').textContent =
  teamName || 'Fixtures';

document.getElementById('division-tag').textContent =
  divisionName;

document.getElementById('subtitle').textContent =
  `2026/27 · ${divisionName} · all scheduled matches`;

const back = document.getElementById('back-link');

back.href =
  `team.html?team=${encodeURIComponent(teamName)}&div=${encodeURIComponent(div)}`;


/* -------------------------------------------------------
   TEAM NAME MATCHING
------------------------------------------------------- */

function normalize(value){

  return String(value || '')
    .toLowerCase()
    .replace(/&/g,'and')
    .replace(/[^a-z0-9]/g,'');

}

function teamMatches(name){

  const a = normalize(name);
  const b = normalize(teamName);

  if(!a || !b) return false;

  return (
    a === b ||
    a.includes(b) ||
    b.includes(a)
  );

}


/* -------------------------------------------------------
   DATE HELPERS
------------------------------------------------------- */

function dateObject(value){

  if(!value) return null;

  const d = new Date(value);

  if(Number.isNaN(d.getTime())) {
    return null;
  }

  return d;

}

function monthLabel(value){

  const d = dateObject(value);

  if(!d) return 'Date TBC';

  return d.toLocaleDateString('en-GB',{
    month:'long',
    year:'numeric'
  });

}

function matchDate(value){

  const d = dateObject(value);

  if(!d){
    return 'Date TBC';
  }

  return d.toLocaleDateString('en-GB',{
    weekday:'short',
    day:'numeric',
    month:'short'
  });

}

function matchTime(value){

  const d = dateObject(value);

  if(!d){
    return 'TBC';
  }

  return d.toLocaleTimeString('en-GB',{
    hour:'2-digit',
    minute:'2-digit'
  });

}


/* -------------------------------------------------------
   ESCAPE HTML
------------------------------------------------------- */

function escapeHtml(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


/* -------------------------------------------------------
   LOAD DATA
------------------------------------------------------- */

async function loadFootballData(){

  const response =
    await fetch('data/football-data.json',{
      cache:'no-store'
    });

  if(!response.ok){
    throw new Error(
      `Could not load football-data.json (${response.status})`
    );
  }

  const data = await response.json();

  if(!data || !Array.isArray(data.matches)){
    throw new Error(
      'football-data.json does not contain a matches array'
    );
  }

  return data;

}


/* -------------------------------------------------------
   FILTER TEAM FIXTURES
------------------------------------------------------- */

function getTeamFixtures(data){

  const matches = data.matches || [];

  const filtered = matches.filter(match => {

    if(!match) return false;

    const home =
      match.home?.name ||
      match.homeTeam ||
      '';

    const away =
      match.away?.name ||
      match.awayTeam ||
      '';

    if(!teamMatches(home) && !teamMatches(away)){
      return false;
    }

    /*
      Keep the team's division fixtures and cups.

      League fixtures have the selected competition code:
        eng.1
        eng.2
        eng.3
        eng.4

      Cup fixtures use codes such as:
        eng.league_cup
        eng.fa
    */

    const code =
      String(match.competitionCode || '')
        .toLowerCase();

    const type =
      String(match.type || '')
        .toLowerCase();

    const competition =
      String(match.competition || '')
        .toLowerCase();

    const isLeague =
      code === competitionCode;

    const isCup =
      type === 'cup' ||
      code.includes('cup') ||
      competition.includes('cup');

    return isLeague || isCup;

  });

  /*
    Remove duplicate match IDs.
  */

  const seen = new Set();

  const unique = filtered.filter(match => {

    const key =
      match.id ||
      [
        match.date,
        match.home?.name,
        match.away?.name
      ].join('|');

    if(seen.has(key)){
      return false;
    }

    seen.add(key);
    return true;

  });

  /*
    Sort from oldest to newest.
  */

  unique.sort((a,b)=>{

    const da =
      dateObject(a.date)?.getTime() ||
      Number.MAX_SAFE_INTEGER;

    const db =
      dateObject(b.date)?.getTime() ||
      Number.MAX_SAFE_INTEGER;

    return da - db;

  });

  return unique;

}


/* -------------------------------------------------------
   RENDER
------------------------------------------------------- */

function renderFixtures(data){

  const root =
    document.getElementById('fixtures');

  const fixtures =
    getTeamFixtures(data);

  console.log(
    'The92Weekly fixture data:',
    data.matches.length,
    'total matches'
  );

  console.log(
    `${teamName}:`,
    fixtures.length,
    'fixtures found'
  );

  if(!fixtures.length){

    root.innerHTML = `
      <div class="status">
        No fixtures were found for ${escapeHtml(teamName)}.
      </div>
    `;

    return;

  }

  /*
    Group fixtures by month.
  */

  const groups = {};

  fixtures.forEach(match => {

    const label =
      monthLabel(match.date);

    if(!groups[label]){
      groups[label] = [];
    }

    groups[label].push(match);

  });

  let html = '';

  Object.entries(groups).forEach(
    ([month,matches]) => {

      html += `
        <section class="month">

          <h2>
            ${escapeHtml(month)}
          </h2>
      `;

      matches.forEach(match => {

        const home =
          match.home?.name ||
          match.homeTeam ||
          'Home';

        const away =
          match.away?.name ||
          match.awayTeam ||
          'Away';

        const competition =
          match.competition ||
          'Football';

        const date =
          matchDate(match.date);

        const time =
          match.completed
            ? 'FT'
            : match.date
              ? matchTime(match.date)
              : 'TBC';

        let score = '';

        const homeScore =
          match.home?.score;

        const awayScore =
          match.away?.score;

        if(
          homeScore !== undefined &&
          homeScore !== null &&
          awayScore !== undefined &&
          awayScore !== null
        ){

          score =
            `${homeScore}–${awayScore}`;

        } else if(
          match.statusDetail
        ){

          const status =
            String(match.statusDetail);

          if(
            /postponed|cancelled|abandoned|tbc|suspended/i
              .test(status)
          ){

            score = status;

          }

        }

        html += `
          <div class="match">

            <div class="match-main">

              <div class="teams">
                ${escapeHtml(home)}
                vs
                ${escapeHtml(away)}
              </div>

              <div class="meta">
                ${escapeHtml(competition)}
                ·
                ${escapeHtml(date)}
                ·
                ${escapeHtml(time)}

                ${
                  match.venue
                    ? ` · ${escapeHtml(match.venue)}`
                    : ''
                }
              </div>

            </div>

            <div class="score">
              ${escapeHtml(score)}
            </div>

          </div>
        `;

      });

      html += `
        </section>
      `;

    }
  );

  html += `
    <div class="note">
      Fixture data supplied from The92Weekly football data feed.
    </div>
  `;

  root.innerHTML = html;

}


/* -------------------------------------------------------
   START
------------------------------------------------------- */

loadFootballData()
  .then(renderFixtures)
  .catch(error => {

    console.error(error);

    document.getElementById('fixtures').innerHTML = `
      <div class="status error">
        We could not load the fixture list right now.
        Please refresh the page in a moment.
      </div>
    `;

  });

</script>

</body>
</html>
