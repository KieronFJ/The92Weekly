<body>

<header>
  <div>
    <a href="index.html">
      <div class="nameplate">THE<span>92</span>WEEKLY</div>
    </a>
  </div>

  <nav>
    <a href="membership.html">Membership</a>
    <a href="index.html#latest">Latest</a>
    <a href="teams.html">Teams</a>
    <a href="tables.html">Tables</a>
    <a href="about.html">About</a>
  </nav>
</header>

<main>

  <div class="breadcrumb">
    <a href="index.html">Home</a> /
    <a href="teams.html">All 92</a> /
    <span id="crumb">Fixtures</span>
  </div>

  <a id="back-link" class="back" href="#">
    ← Back to team
  </a>

  <span id="division-tag" class="tag">
    DIVISION
  </span>

  <h1 id="team-name">
    Loading…
  </h1>

  <div id="subtitle" class="subtitle">
    Full-season fixtures
  </div>

  <div id="fixtures">
    <div class="status">
      Loading the full 2026/27 season…
    </div>
  </div>

</main>

<script>

const params = new URLSearchParams(location.search);

const teamName = params.get('team') || '';
const div = params.get('div') || '1';

const divisionNames = {
  1:'Premier League',
  2:'Championship',
  3:'League One',
  4:'League Two'
};

const espnLeagues = {
  1:'eng.1',
  2:'eng.2',
  3:'eng.3',
  4:'eng.4'
};

const divisionName =
  divisionNames[div] || 'English football';

const league =
  espnLeagues[div] || 'eng.1';

document.getElementById('team-name').textContent =
  teamName || 'Team';

document.getElementById('crumb').textContent =
  teamName || 'Fixtures';

document.getElementById('division-tag').textContent =
  divisionName;

document.getElementById('subtitle').textContent =
  `2026/27 · ${divisionName} · all scheduled matches`;

const back =
  document.getElementById('back-link');

back.href =
  `team.html?team=${encodeURIComponent(teamName)}&div=${encodeURIComponent(div)}`;


/* -----------------------------
   TEAM NAME HELPERS
----------------------------- */

function normalize(value){
  return String(value || '')
    .toLowerCase()
    .replace(/&/g,'and')
    .replace(/[^a-z0-9]/g,'');
}

function matchesTeam(a,b){

  const x = normalize(a);
  const y = normalize(b);

  if(!x || !y) return false;

  return (
    x === y ||
    x.includes(y) ||
    y.includes(x)
  );
}


/* -----------------------------
   PROXY
----------------------------- */

function proxy(url){

  const worker =
    'https://the92weekly-proxyv2.the92weekly.workers.dev/?url='
    + encodeURIComponent(url);

  return fetch(worker)
    .then(response => {

      if(!response.ok){
        throw new Error(
          `Proxy error (${response.status})`
        );
      }

      return response.json();
    });
}


/* -----------------------------
   FIND TEAM ID
----------------------------- */

async function getTeamId(){

  const url =
    `https://site.api.espn.com/apis/site/v2/sports/soccer/${league}/teams?limit=100`;

  const data =
    await proxy(url);

  const teams =
    data.sports?.[0]?.leagues?.[0]?.teams || [];

  const teamObjects =
    teams.map(item => item.team).filter(Boolean);

  let found =
    teamObjects.find(team =>
      matchesTeam(
        team.displayName,
        teamName
      )
    );

  if(!found){

    found =
      teamObjects.find(team =>
        matchesTeam(
          team.name,
          teamName
        )
      );
  }

  if(!found){
    throw new Error(
      `Team "${teamName}" could not be found`
    );
  }

  return found.id;
}


/* -----------------------------
   NORMALISE ESPN FIXTURE
----------------------------- */

function normaliseEvent(ev){

  const competition =
    ev.competitions?.[0];

  const competitors =
    competition?.competitors || [];

  const home =
    competitors.find(
      x => x.homeAway === 'home'
    );

  const away =
    competitors.find(
      x => x.homeAway === 'away'
    );

  if(!home || !away){
    return null;
  }

  const status =
    ev.status?.type ||
    competition?.status?.type ||
    {};

  const homeScore =
    home.score != null
      ? Number(home.score)
      : null;

  const awayScore =
    away.score != null
      ? Number(away.score)
      : null;

  return {

    id:String(ev.id || ''),

    date:ev.date || '',

    season:
      ev.season?.year ??
      null,

    competition:'',
    
    completed:
      Boolean(status.completed),

    statusDetail:
      status.detail || '',

    home:
      home.team?.displayName ||
      home.team?.name ||
      '',

    away:
      away.team?.displayName ||
      away.team?.name ||
      '',

    homeScore,

    awayScore
  };
}


/* -----------------------------
   COMPETITION NAME
----------------------------- */

function competitionName(ev){

  const competition =
    ev.competitions?.[0];

  const typeText =
    competition?.type?.text || '';

  if(
    typeText &&
    !/^regular season$/i.test(typeText)
  ){
    return typeText;
  }

  const seasonName =
    ev.season?.displayName || '';

  if(seasonName){
    return seasonName;
  }

  return divisionName;
}


/* -----------------------------
   LOAD FULL SEASON
----------------------------- */

async function loadSeason(){

  const id =
    await getTeamId();

  /*
    IMPORTANT:

    Explicitly request the 2026 season
    and a large number of events.

    This prevents the page from relying
    on ESPN's default result limit.
  */

  const scheduleUrl =
    `https://site.api.espn.com/apis/site/v2/sports/soccer/${league}/teams/${id}/schedule?season=2026&limit=500`;

  const data =
    await proxy(scheduleUrl);

  let events =
    (data.events || [])
      .map(ev => {

        const match =
          normaliseEvent(ev);

        if(!match){
          return null;
        }

        match.competition =
          competitionName(ev);

        return match;
      })
      .filter(Boolean);


  /*
    Keep the 2026/27 season.

    ESPN normally returns the correct season
    from the season parameter, but we also
    protect against unrelated events.
  */

  events =
    events.filter(match => {

      if(
        match.season === null ||
        match.season === undefined
      ){
        return true;
      }

      return Number(match.season) === 2026;
    });


  /*
    Remove duplicate fixtures.
  */

  const seen =
    new Set();

  events =
    events.filter(match => {

      const key =
        match.id ||
        `${match.date}|${match.home}|${match.away}`;

      if(seen.has(key)){
        return false;
      }

      seen.add(key);

      return true;
    });


  /*
    Sort chronologically.
  */

  events.sort(
    (a,b) =>
      new Date(a.date) -
      new Date(b.date)
  );


  return events;
}


/* -----------------------------
   MONTH LABEL
----------------------------- */

function monthLabel(date){

  return new Date(date)
    .toLocaleDateString(
      'en-GB',
      {
        month:'long',
        year:'numeric'
      }
    );
}


/* -----------------------------
   RENDER FIXTURES
----------------------------- */

function render(events){

  const root =
    document.getElementById('fixtures');


  if(!events.length){

    root.innerHTML = `
      <div class="status">
        No 2026/27 fixtures were returned
        for this team.
      </div>
    `;

    return;
  }


  /*
    Group fixtures by month.
  */

  const groups = {};

  events.forEach(match => {

    const month =
      monthLabel(match.date);

    if(!groups[month]){
      groups[month] = [];
    }

    groups[month].push(match);
  });


  let html = '';


  for(
    const [month,matches]
    of Object.entries(groups)
  ){

    html += `
      <section class="month">
        <h2>${month}</h2>
    `;


    matches.forEach(match => {

      const date =
        new Date(match.date);

      const dateText =
        date.toLocaleDateString(
          'en-GB',
          {
            weekday:'short',
            day:'numeric',
            month:'short'
          }
        );


      const timeText =
        date.toLocaleTimeString(
          'en-GB',
          {
            hour:'2-digit',
            minute:'2-digit'
          }
        );


      const hasScore =
        match.homeScore !== null &&
        match.awayScore !== null;


      const score =
        hasScore
          ? `${match.homeScore}–${match.awayScore}`
          : '';


      html += `
        <div class="match">

          <div class="match-main">

            <div class="teams">
              ${match.home}
              vs
              ${match.away}
            </div>

            <div class="meta">
              ${match.competition}
              ·
              ${dateText}
              ·
              ${timeText}
            </div>

          </div>

          <div class="score">
            ${score}
          </div>

        </div>
      `;
    });


    html += `
      </section>
    `;
  }


  /*
    Add a small information note.
  */

  html += `
    <div class="note">
      Full 2026/27 scheduled fixture list.
      Completed matches display their scores;
      upcoming matches display their scheduled
      date and time.
    </div>
  `;


  root.innerHTML =
    html;
}


/* -----------------------------
   START
----------------------------- */

loadSeason()

  .then(render)

  .catch(error => {

    console.error(
      'Fixture loading error:',
      error
    );

    document.getElementById(
      'fixtures'
    ).innerHTML = `

      <div class="status">

        We could not load the full
        2026/27 fixture list right now.

        <br><br>

        Please refresh the page
        in a moment.

      </div>

    `;
  });

</script>

</body>
</html>
