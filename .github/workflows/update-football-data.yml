name: Update football data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update football data
        run: node scripts/update-football-data.js

      - name: Commit updated data
        run: |
          git config user.name "The92 Weekly Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/football-data.json
          if git diff --cached --quiet; then
            echo "No football data changes."
            exit 0
          fi
          git commit -m "chore: update football data"
          git push
