name: Update Ins & Outs

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ins-outs-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update Ins & Outs
        run: node scripts/update-transfers.js

      - name: Commit updated transfer data
        run: |
          git config user.name "The92 Weekly Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/transfers.json
          if git diff --cached --quiet; then
            echo "No transfer data changes."
            exit 0
          fi
          git commit -m "chore: update ins and outs"
          git push || (git pull --rebase && git push)
