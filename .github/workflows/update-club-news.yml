name: Update club news

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: club-news-update
  cancel-in-progress: false

jobs:

  update:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Update club news
        run: node scripts/update-club-news.js

      - name: Commit updated data
        run: |

          git config user.name "The92 Weekly Data Bot"

          git config user.email "actions@users.noreply.github.com"

          git add data/club-news.json

          if git diff --cached --quiet; then

            echo "No club news changes."

            exit 0

          fi

          git commit -m "chore: update club news"

          git push
