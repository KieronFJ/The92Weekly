name: Update transfer news

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transfer-news-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Update transfer news
        run: node scripts/update-transfers.js

      - name: Commit updated transfer data
        run: |
          git config user.name "The92Weekly Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/transfers.json
          if git diff --cached --quiet; then
            echo "No transfer-news changes to commit."
          else
            git commit -m "Update transfer news"
            git push
          fi
