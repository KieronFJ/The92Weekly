<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team — The92Weekly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --panel: #F6F5F1;
    --line: #E3E0D8;
    --line-soft: #EDEAE3;
    --ink: #2E3136;
    --ink-muted: #74787E;
    --gold: #C8102E;
    --win: #3E8A4D;
    --loss: #B5504B;
    --draw: #74787E;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .display { font-family: 'Poppins', sans-serif; letter-spacing: 0.01em; }

  header {
    border-bottom: 1px solid var(--line);
    padding: 28px 6vw 24px;
    display: flex; justify-content: space-between; align-items: flex-end;
    flex-wrap: wrap; gap: 12px;
  }
  .nameplate { font-size: clamp(30px, 4.4vw, 40px); font-weight: 700; line-height: 1; text-transform: uppercase; }
  .nameplate span { color: var(--gold); }
  nav {
    display: flex; gap: 24px;
    padding-bottom: 4px;
  }
  nav a, .nav-trigger {
    font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 500; letter-spacing: 0.01em; line-height: 1;
    color: var(--ink-muted); border-bottom: 2px solid transparent; padding: 0 0 4px 0; margin: 0;
    background: none; border-top: none; border-left: none; border-right: none; cursor: pointer;
  }
  nav a:hover, .nav-trigger:hover, .nav-item.open .nav-trigger { color: var(--ink); border-bottom-color: var(--gold); }

  .nav-item { position: relative; }
  .nav-trigger { display: flex; align-items: center; gap: 5px; }
  .nav-trigger::after { content: '▾'; font-size: 8px; position: relative; top: 1px; }
  .dropdown-panel {
    display: none;
    position: absolute; top: calc(100% + 21px); right: 0;
    background: var(--panel); border: 1px solid var(--line);
    padding: 26px; min-width: 620px; max-width: min(90vw, 700px);
    grid-template-columns: repeat(4, 1fr); gap: 22px;
    z-index: 60; max-height: 68vh; overflow-y: auto;
  }
  .nav-item:hover .dropdown-panel, .nav-item.open .dropdown-panel { display: grid; }

  .dropdown-col h4 {
    font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--gold);
    margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .dropdown-col a {
    display: block; font-family: 'Poppins', sans-serif; font-size: 13.5px; font-weight: 500;
    color: var(--ink); padding: 6px 8px 6px 10px; margin-bottom: 3px;
    border-radius: 3px; transition: filter .12s, transform .12s;
  }
  .dropdown-col a:hover { filter: brightness(0.94); transform: translateX(2px); }
  .dropdown-footer {
    grid-column: 1 / -1; margin-top: 4px; padding-top: 14px; border-top: 1px solid var(--line);
    font-family: 'JetBrains Mono', monospace; font-size: 11.5px;
  }
  .dropdown-footer a { color: var(--gold); }
  .dropdown-footer a:hover { border-bottom: 1px solid var(--gold); }

  @media (max-width: 780px) {
    .dropdown-panel {
      position: fixed; left: 0; right: 0; top: auto;
      min-width: 0; max-width: none; width: 100%;
      grid-template-columns: repeat(2, 1fr);
      border-left: none; border-right: none;
      max-height: 60vh;
    }
  }

  .breadcrumb {
    max-width: 68ch; margin: 32px auto 0; padding: 0 6vw;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-muted);
  }
  .breadcrumb a:hover { color: var(--gold); }

  main { max-width: 68ch; margin: 0 auto; padding: 24px 6vw 80px; }

  .team-tag {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--bg);
    background: var(--gold); padding: 4px 9px; border-radius: 2px;
    letter-spacing: 0.06em; display: inline-block; margin-bottom: 18px;
  }
  h1 {
    font-family: 'Poppins', sans-serif; font-weight: 600; text-transform: none;
    font-size: clamp(30px, 5vw, 48px); margin-bottom: 36px; line-height: 1.1;
  }

  .result-card {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 32px;
    margin-bottom: 20px;
  }
  .result-label {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--gold);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 20px;
  }
  .result-teams {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .result-team { font-family: 'Poppins', sans-serif; font-size: 19px; font-weight: 500; flex: 1; }
  .result-team.us { color: var(--team-color, var(--gold)); font-weight: 600; }
  .result-score {
    font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700;
    padding: 6px 18px; border: 1px solid var(--line);
  }
  .result-meta {
    font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--ink-muted);
    display: flex; gap: 20px; flex-wrap: wrap; padding-top: 18px; border-top: 1px solid var(--line-soft);
  }
  .result-outcome {
    display: inline-block; padding: 3px 10px; border-radius: 2px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
    letter-spacing: 0.04em; margin-bottom: 20px;
  }
  .outcome-win { background: var(--win); color: #0d1a10; }
  .outcome-loss { background: var(--loss); color: #1a0d0d; }
  .outcome-draw { background: var(--draw); color: #14171C; }

  .status-box {
    font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--ink-muted);
    padding: 40px 0; text-align: center;
  }

  .division-note {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-muted);
    margin-top: 24px;
  }

  footer {
    max-width: 68ch; margin: 0 auto; padding: 40px 6vw 56px;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 12px;
  }
  footer p { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--ink-muted); }
  .footer-links { display: flex; gap: 18px; }
  .footer-links a { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--ink-muted); }
  .footer-links a:hover { color: var(--gold); }
</style>
</head>
<body>

  <header>
    <div><a href="index.html"><div class="nameplate display"><span>THE92</span>WEEKLY</div></a></div>
    <nav>
      <a href="index.html#latest">Latest</a>
      <div class="nav-item" id="teams-nav-item">
        <button class="nav-trigger" type="button" id="teams-trigger">Teams</button>
        <div class="dropdown-panel" id="teams-dropdown-panel"></div>
      </div>
      <a href="index.html#spotlight">Spotlight</a>
      <a href="ins-and-outs.html">Ins &amp; Outs (Transfer Centre)</a>
      <a href="membership.html">Membership</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <div class="breadcrumb"><a href="index.html">Home</a> / <a href="teams.html">All 92</a> / <span id="crumb-team">Team</span></div>

  <main>
    <span class="team-tag" id="division-tag">Division</span>
    <h1 id="team-name">Loading…</h1>

    <div id="content">
      <div class="status-box">Fetching latest result…</div>
    </div>
  </main>

  <footer>
    <p>THE92WEEKLY — Football across the pyramid.</p>
    <div class="footer-links">
      <a href="#">X / Twitter</a>
      <a href="about.html">About</a>
      <a href="mailto:hello@92weekly.com">Contact</a>
    </div>
  </footer>

  <script>
    const clubColors = {
      "Arsenal":"#EF0107","Aston Villa":"#670E36","Bournemouth":"#DA291C","Brentford":"#E30613","Brighton & Hove Albion":"#0057B8","Chelsea":"#034694","Coventry City":"#6CADDF","Crystal Palace":"#1B458F","Everton":"#003399","Fulham":"#1A1A1A","Hull City":"#F18A00","Ipswich Town":"#3A64A3","Leeds United":"#1D428A","Liverpool":"#C8102E","Manchester City":"#6CABDD","Manchester United":"#DA291C","Newcastle United":"#111111","Nottingham Forest":"#DD0000","Sunderland":"#EB172F","Tottenham Hotspur":"#132257",
      "Birmingham City":"#003090","Blackburn Rovers":"#009EE0","Bolton Wanderers":"#002B5C","Bristol City":"#E21C21","Burnley":"#6C1D45","Cardiff City":"#0070B5","Charlton Athletic":"#D2122E","Derby County":"#1A1A1A","Lincoln City":"#C8102E","Middlesbrough":"#E2231A","Millwall":"#1B3D6D","Norwich City":"#00A650","Portsmouth":"#001489","Preston North End":"#0033A0","Queens Park Rangers":"#1D5BA4","Sheffield United":"#EE2737","Southampton":"#D71920","Stoke City":"#E03A3E","Swansea City":"#1A1A1A","Watford":"#FBEE23","West Bromwich Albion":"#122F67","West Ham United":"#7A263A","Wolverhampton Wanderers":"#FDB913","Wrexham":"#E31B23",
      "Barnsley":"#ED1C24","Blackpool":"#F58220","Bradford City":"#7A1E27","Doncaster Rovers":"#E2231A","Huddersfield Town":"#0E63AD","Leyton Orient":"#D2122E","Luton Town":"#F68712","Mansfield Town":"#FDB913","Peterborough United":"#0044A9","Plymouth Argyle":"#007A3D","Reading":"#004494","Stevenage":"#B30E22","Stockport County":"#0E56A6","Wigan Athletic":"#1B458F","Wycombe Wanderers":"#1E3A8A","Burton Albion":"#FFD100","AFC Wimbledon":"#1B458F","Oxford United":"#FFD200","Leicester City":"#003090","Sheffield Wednesday":"#1B3E8C","Bromley":"#12284C","Milton Keynes Dons":"#E2231A","Cambridge United":"#FFD400","Notts County":"#1A1A1A",
      "Accrington Stanley":"#D2122E","Barnet":"#FDB913","Bristol Rovers":"#0E56A6","Cheltenham Town":"#DD0000","Chesterfield":"#0E56A6","Colchester United":"#0E56A6","Crawley Town":"#D2122E","Crewe Alexandra":"#D2122E","Fleetwood Town":"#D2122E","Gillingham":"#0E56A6","Grimsby Town":"#1A1A1A","Morecambe":"#D2122E","Newport County":"#FDB913","Salford City":"#FDB913","Shrewsbury Town":"#0E56A6","Swindon Town":"#D2122E","Tranmere Rovers":"#12284C","Walsall":"#D2122E","Exeter City":"#D2122E","Port Vale":"#D8A21B","Rotherham United":"#D2122E","Northampton Town":"#7A263A","York City":"#7A263A","Rochdale":"#0E56A6"
    };

    const params = new URLSearchParams(window.location.search);
    const teamName = params.get('team') || '';
    const div = params.get('div') || '1';
    const divisionNames = { 1: 'Premier League', 2: 'Championship', 3: 'League One', 4: 'League Two' };

    const teamColor = clubColors[teamName] || '#C8102E';
    document.documentElement.style.setProperty('--team-color', teamColor);
    document.body.style.background = `color-mix(in srgb, ${teamColor} 22%, white)`;

    document.getElementById('team-name').textContent = teamName;
    document.getElementById('crumb-team').textContent = teamName;
    document.getElementById('division-tag').textContent = divisionNames[div] || 'Division';
    document.getElementById('division-tag').style.background = teamColor;
    document.getElementById('division-tag').style.color = '#FFFFFF';

    const SEASON = '2025-26';
    const dataUrl = `https://raw.githubusercontent.com/openfootball/football.json/master/${SEASON}/en.${div}.json`;

    function normalize(s) {
      return s.toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function matchesTeam(fixtureName, target) {
      const a = normalize(fixtureName);
      const b = normalize(target);
      return a.includes(b) || b.includes(a);
    }

    fetch(dataUrl)
      .then(r => {
        if (!r.ok) throw new Error('Fetch failed: ' + r.status);
        return r.json();
      })
      .then(data => {
        const matches = (data.matches || []).filter(m =>
          m.score && m.score.ft &&
          (matchesTeam(m.team1, teamName) || matchesTeam(m.team2, teamName))
        );

        if (matches.length === 0) {
          document.getElementById('content').innerHTML =
            '<div class="status-box">We don\'t have a completed match for ' + teamName + ' yet this season.<br><br>' +
            'That can happen early on, or if the club name doesn\'t quite match our data source — ' +
            'you can check the raw feed here: <a href="' + dataUrl + '" style="color:var(--gold)">raw data</a>.</div>';
          return;
        }

        matches.sort((a, b) => new Date(b.date) - new Date(a.date));
        const last = matches[0];

        const isHome = matchesTeam(last.team1, teamName);
        const us = isHome ? last.team1 : last.team2;
        const them = isHome ? last.team2 : last.team1;
        const usScore = isHome ? last.score.ft[0] : last.score.ft[1];
        const themScore = isHome ? last.score.ft[1] : last.score.ft[0];

        let outcomeClass = 'outcome-draw', outcomeText = 'DRAW';
        if (usScore > themScore) { outcomeClass = 'outcome-win'; outcomeText = 'WIN'; }
        else if (usScore < themScore) { outcomeClass = 'outcome-loss'; outcomeText = 'LOSS'; }

        document.getElementById('content').innerHTML = `
          <div class="result-card">
            <div class="result-label">Last Result — ${last.round || ''}</div>
            <span class="result-outcome ${outcomeClass}">${outcomeText}</span>
            <div class="result-teams">
              <div class="result-team us">${us}</div>
              <div class="result-score">${usScore} – ${themScore}</div>
              <div class="result-team">${them}</div>
            </div>
            <div class="result-meta">
              <span>${last.date}</span>
              <span>${isHome ? 'Home' : 'Away'}</span>
              <span>${divisionNames[div]}</span>
            </div>
          </div>
          <div class="division-note">Data via football.json, updated as results come in. ${matches.length} completed match${matches.length !== 1 ? 'es' : ''} found this season.</div>
        `;
      })
      .catch(err => {
        document.getElementById('content').innerHTML =
          '<div class="status-box">Couldn\'t load live results right now (' + err.message + ').<br><br>' +
          'Try refreshing, or check back shortly.</div>';
      });
  </script>
  <script>
    const dropdownClubsByDiv = {
      1: ["Arsenal","Aston Villa","Bournemouth","Brentford","Brighton & Hove Albion","Chelsea","Coventry City","Crystal Palace","Everton","Fulham","Hull City","Ipswich Town","Leeds United","Liverpool","Manchester City","Manchester United","Newcastle United","Nottingham Forest","Sunderland","Tottenham Hotspur"],
      2: ["Birmingham City","Blackburn Rovers","Bolton Wanderers","Bristol City","Burnley","Cardiff City","Charlton Athletic","Derby County","Lincoln City","Middlesbrough","Millwall","Norwich City","Portsmouth","Preston North End","Queens Park Rangers","Sheffield United","Southampton","Stoke City","Swansea City","Watford","West Bromwich Albion","West Ham United","Wolverhampton Wanderers","Wrexham"],
      3: ["Barnsley","Blackpool","Bradford City","Doncaster Rovers","Huddersfield Town","Leyton Orient","Luton Town","Mansfield Town","Peterborough United","Plymouth Argyle","Reading","Stevenage","Stockport County","Wigan Athletic","Wycombe Wanderers","Burton Albion","AFC Wimbledon","Oxford United","Leicester City","Sheffield Wednesday","Bromley","Milton Keynes Dons","Cambridge United","Notts County"],
      4: ["Accrington Stanley","Barnet","Bristol Rovers","Cheltenham Town","Chesterfield","Colchester United","Crawley Town","Crewe Alexandra","Fleetwood Town","Gillingham","Grimsby Town","Morecambe","Newport County","Salford City","Shrewsbury Town","Swindon Town","Tranmere Rovers","Walsall","Exeter City","Port Vale","Rotherham United","Northampton Town","York City","Rochdale"]
    };
    const dropdownDivNames = { 1: "Premier League", 2: "Championship", 3: "League One", 4: "League Two" };

    const navPanel = document.getElementById('teams-dropdown-panel');
    if (navPanel) {
      let navHtml = '';
      for (const div in dropdownClubsByDiv) {
        navHtml += `<div class="dropdown-col"><h4>${dropdownDivNames[div]}</h4>`;
        dropdownClubsByDiv[div].forEach(name => {
          const c = clubColors[name] || '#C8102E';
          navHtml += `<a href="team.html?team=${encodeURIComponent(name)}&div=${div}" style="background:color-mix(in srgb, ${c} 34%, white); border-left:3px solid ${c};">${name}</a>`;
        });
        navHtml += `</div>`;
      }
      navHtml += `<div class="dropdown-footer"><a href="teams.html">View full directory →</a></div>`;
      navPanel.innerHTML = navHtml;
    }

    const teamsItem = document.getElementById('teams-nav-item');
    const teamsTrigger = document.getElementById('teams-trigger');
    if (teamsItem && teamsTrigger) {
      teamsTrigger.addEventListener('click', function(e) {
        e.stopPropagation();
        teamsItem.classList.toggle('open');
      });
      document.addEventListener('click', function() {
        teamsItem.classList.remove('open');
      });
      navPanel.addEventListener('click', function(e) { e.stopPropagation(); });
    }
  </script>

</body>
</html>
